name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # ручной запуск кнопкой Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android-часть проекта генерируется заново, в репозитории хранится только код
      - name: Create Android scaffold
        run: flutter create --platforms=android --org com.domovoi4ik --project-name history_nearby .

      - name: Patch manifest (permissions, app name)
        run: python3 tools/patch_manifest.py

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HistoryNearby-apk
          path: build/app/outputs/flutter-apk/app-release.apk
